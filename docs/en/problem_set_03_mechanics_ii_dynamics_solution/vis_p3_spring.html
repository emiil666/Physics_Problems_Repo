<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>P3 – Spring Force & Potential Energy</title>
<style>
  body { margin:0; background:#0f0f1a; color:#eee; font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px; }
  h2 { color:#7eb8f7; }
  .row { display:flex; gap:20px; }
  canvas { background:#16182a; border:1px solid #2a2d4a; border-radius:8px; }
  .controls { background:#1e2240; border-radius:8px; padding:12px 20px; margin:12px 0; display:flex; gap:20px; align-items:center; }
  label { color:#aaa; font-size:13px; }
  input[type=range] { width:120px; }
  .val { color:#7eb8f7; font-weight:bold; min-width:40px; }
  .legend { display:flex; gap:20px; margin:8px 0; font-size:13px; }
  .dot { width:14px; height:4px; display:inline-block; border-radius:2px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<h2>Problem 3 – F(x) = −kx &nbsp;and&nbsp; U(x) = ½kx²</h2>
<div class="controls">
  <label>k = <span class="val" id="kv">1.0</span> N/m
    <input type="range" id="kslider" min="0.1" max="5" step="0.1" value="1.0">
  </label>
  <label>x₀ = <span class="val" id="x0v">2.0</span> m
    <input type="range" id="x0slider" min="0.5" max="4" step="0.1" value="2.0">
  </label>
</div>
<div class="legend">
  <span><span class="dot" style="background:#ff6b6b"></span>F(x) = −kx</span>
  <span><span class="dot" style="background:#ffd740"></span>U(x) = ½kx²</span>
  <span><span class="dot" style="background:#4caf50;width:8px;height:8px;border-radius:50%"></span>x₀ point</span>
</div>
<div class="row">
  <canvas id="fc" width="400" height="380"></canvas>
  <canvas id="uc" width="400" height="380"></canvas>
</div>
<div id="info" style="margin-top:12px;font-size:13px;color:#aaa;text-align:center;background:#1e2240;border-radius:8px;padding:10px 24px;"></div>

<script>
const fc = document.getElementById('fc').getContext('2d');
const uc = document.getElementById('uc').getContext('2d');
const W = 400, H = 380, pad = 50;

let k = 1.0, x0 = 2.0;

function toC(ctx, xv, yv, xmin, xmax, ymin, ymax) {
  return {
    cx: pad + (xv - xmin) / (xmax - xmin) * (W - 2*pad),
    cy: H - pad - (yv - ymin) / (ymax - ymin) * (H - 2*pad)
  };
}

function drawAxes(ctx, title, xlabel, ylabel) {
  ctx.clearRect(0,0,W,H);
  // Title
  ctx.fillStyle='#7eb8f7'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText(title, W/2, 24);
  // Axis labels
  ctx.fillStyle='#888'; ctx.font='12px sans-serif';
  ctx.fillText(xlabel, W/2, H-8);
  ctx.save(); ctx.translate(14, H/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(ylabel, 0, 0); ctx.restore();
}

function drawGraph() {
  const xmin = -5, xmax = 5;
  const fmin = -k*xmax*1.1 - 0.5, fmax = k*xmax*1.1 + 0.5;
  const umin = -0.5, umax = 0.5*k*xmax*xmax*1.1 + 0.5;

  // Force graph
  drawAxes(fc, 'F(x) = −kx', 'x (m)', 'F (N)');
  // Grid lines
  fc.strokeStyle = '#1e2040'; fc.lineWidth = 1;
  for(let gx = xmin; gx <= xmax; gx++) {
    const {cx} = toC(fc, gx, 0, xmin, xmax, fmin, fmax);
    fc.beginPath(); fc.moveTo(cx, pad); fc.lineTo(cx, H-pad); fc.stroke();
    if(gx !== 0) { fc.fillStyle='#555'; fc.font='10px monospace'; fc.textAlign='center'; fc.fillText(gx, cx, H-pad+14); }
  }
  const o = toC(fc, 0, 0, xmin, xmax, fmin, fmax);
  fc.strokeStyle='#3a3d5a'; fc.lineWidth=1.5;
  fc.beginPath(); fc.moveTo(pad, o.cy); fc.lineTo(W-pad, o.cy); fc.stroke();
  fc.beginPath(); fc.moveTo(o.cx, pad); fc.lineTo(o.cx, H-pad); fc.stroke();
  fc.fillStyle='#555'; fc.font='10px monospace'; fc.textAlign='right';
  fc.fillText('0', o.cx-4, o.cy+4);
  // F(x) line
  fc.beginPath(); fc.strokeStyle='#ff6b6b'; fc.lineWidth=2.5;
  const p1 = toC(fc, xmin, -k*xmin, xmin, xmax, fmin, fmax);
  const p2 = toC(fc, xmax, -k*xmax, xmin, xmax, fmin, fmax);
  fc.moveTo(p1.cx, p1.cy); fc.lineTo(p2.cx, p2.cy); fc.stroke();
  // x0 marker
  const fp0 = toC(fc, x0, -k*x0, xmin, xmax, fmin, fmax);
  fc.beginPath(); fc.arc(fp0.cx, fp0.cy, 7, 0, 2*Math.PI);
  fc.fillStyle='#4caf50'; fc.fill();
  fc.strokeStyle='#fff'; fc.lineWidth=1; fc.stroke();
  // Shaded work area
  fc.beginPath();
  const s = toC(fc, 0, 0, xmin, xmax, fmin, fmax);
  const e = toC(fc, x0, 0, xmin, xmax, fmin, fmax);
  fc.moveTo(s.cx, s.cy);
  const steps = 100;
  for(let i=0; i<=steps; i++) {
    const xv = x0*i/steps;
    const {cx,cy} = toC(fc, xv, -k*xv, xmin, xmax, fmin, fmax);
    fc.lineTo(cx, cy);
  }
  fc.lineTo(e.cx, e.cy); fc.closePath();
  fc.fillStyle='rgba(255,107,107,0.15)'; fc.fill();
  fc.fillStyle='#ff6b6b'; fc.font='12px sans-serif'; fc.textAlign='left';
  fc.fillText(`W = −½kx₀² = ${(-0.5*k*x0*x0).toFixed(2)} J`, pad+4, pad+18);

  // U(x) graph
  drawAxes(uc, 'U(x) = ½kx²', 'x (m)', 'U (J)');
  uc.strokeStyle = '#1e2040'; uc.lineWidth = 1;
  for(let gx = xmin; gx <= xmax; gx++) {
    const {cx} = toC(uc, gx, 0, xmin, xmax, umin, umax);
    uc.beginPath(); uc.moveTo(cx, pad); uc.lineTo(cx, H-pad); uc.stroke();
    if(gx !== 0) { uc.fillStyle='#555'; uc.font='10px monospace'; uc.textAlign='center'; uc.fillText(gx, cx, H-pad+14); }
  }
  const ou = toC(uc, 0, 0, xmin, xmax, umin, umax);
  uc.strokeStyle='#3a3d5a'; uc.lineWidth=1.5;
  uc.beginPath(); uc.moveTo(pad, ou.cy); uc.lineTo(W-pad, ou.cy); uc.stroke();
  uc.beginPath(); uc.moveTo(ou.cx, pad); uc.lineTo(ou.cx, H-pad); uc.stroke();
  // U parabola
  uc.beginPath(); uc.strokeStyle='#ffd740'; uc.lineWidth=2.5;
  for(let i=0; i<=200; i++) {
    const xv = xmin + (xmax - xmin)*i/200;
    const uv = 0.5*k*xv*xv;
    if(uv < umin || uv > umax) continue;
    const {cx,cy} = toC(uc, xv, uv, xmin, xmax, umin, umax);
    i===0 ? uc.moveTo(cx,cy) : uc.lineTo(cx,cy);
  }
  uc.stroke();
  // x0 marker
  const up0 = toC(uc, x0, 0.5*k*x0*x0, xmin, xmax, umin, umax);
  uc.beginPath(); uc.arc(up0.cx, up0.cy, 7, 0, 2*Math.PI);
  uc.fillStyle='#4caf50'; uc.fill();
  uc.strokeStyle='#fff'; uc.lineWidth=1; uc.stroke();
  // Dashed drop line
  uc.setLineDash([4,3]);
  uc.beginPath(); uc.strokeStyle='#4caf50'; uc.lineWidth=1;
  uc.moveTo(up0.cx, up0.cy); uc.lineTo(up0.cx, ou.cy); uc.stroke();
  uc.setLineDash([]);
  uc.fillStyle='#ffd740'; uc.font='12px sans-serif'; uc.textAlign='left';
  uc.fillText(`U(x₀) = ${(0.5*k*x0*x0).toFixed(2)} J`, pad+4, pad+18);

  document.getElementById('info').innerHTML =
    `k = ${k.toFixed(1)} N/m &nbsp;|&nbsp; x₀ = ${x0.toFixed(1)} m &nbsp;|&nbsp; ` +
    `U(x₀) = ½kx₀² = <b style="color:#ffd740">${(0.5*k*x0*x0).toFixed(3)} J</b> &nbsp;|&nbsp; ` +
    `W = −U(x₀) = <b style="color:#ff6b6b">${(-0.5*k*x0*x0).toFixed(3)} J</b> &nbsp;|&nbsp; ` +
    `F(x₀) = −kx₀ = <b style="color:#4caf50">${(-k*x0).toFixed(3)} N</b>`;
}

document.getElementById('kslider').addEventListener('input', e => {
  k = parseFloat(e.target.value);
  document.getElementById('kv').textContent = k.toFixed(1);
  drawGraph();
});
document.getElementById('x0slider').addEventListener('input', e => {
  x0 = parseFloat(e.target.value);
  document.getElementById('x0v').textContent = x0.toFixed(1);
  drawGraph();
});
drawGraph();
</script>
</body>
</html>
